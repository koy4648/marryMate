spring:
  application:
    name: marry-mate-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${MARRY_MATE_DB_HOST:localhost}:${MARRY_MATE_DB_PORT:3306}/${MARRY_MATE_DB_NAME:marry_mate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MARRY_MATE_DB_USER}
    password: ${MARRY_MATE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info