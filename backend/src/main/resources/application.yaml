spring:
  application:
    name: marry-mate-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MARRY_MATE_DB_PORT:3306}/${MARRY_MATE_DB_NAME:marry_mate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MARRY_MATE_DB_USER:marry_mate}
    password: ${MARRY_MATE_DB_PASSWORD:marry_mate_local}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${MARRY_MATE_API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${MARRY_MATE_CORS_ORIGINS:http://localhost:5173}

